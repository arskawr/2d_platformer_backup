name: Unity 2D Platformer CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  sanity_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Unity Directories
        run: |
          if [ -d "ProjectSettings" ]; then echo "OK"; else exit 1; fi
          if [ -d "Packages" ]; then echo "OK"; else exit 1; fi

  run_tests:
    needs: sanity_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/packages-lock.json', 'Assets/**/*.asmdef') }}
      - name: Install GameCI CLI
        run: |
          curl -sL -o game-ci.tar.gz https://github.com/game-ci/cli/releases/download/v0.1.72/game-ci-linux-x64.tar.gz
          tar xzf game-ci.tar.gz ./game-ci
          echo "$PWD" >> $GITHUB_PATH
      - name: Run Unity Tests
        run: |
          game-ci test --docker --dockerShmSize=1025m \
          --engine=unity \
          --testPlatforms='playmode;editmode;COMBINE_RESULTS' \
          --engineVersion=6000.2.12f1 --coverageEnabled=false \
          --artifactsPath=artifacts \
          --dockerIsolationMode=default \
          --containerRegistryRepository=unityci/editor \
          --containerRegistryImageVersion=3
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/

  build_game:
    needs: run_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Build-${{ hashFiles('Packages/packages-lock.json', 'Assets/**/*.asmdef') }}
      - name: Build WebGL Player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: BuildManager.BuildWebGL
          unityVersion: 6000.2.12f1
      - name: Upload WebGL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

  mirror_repo:
    needs: run_tests
    if: github.repository == 'arskawr/ARPO1' 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Push to Backup
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          git push --force https://x-access-token:${{ secrets.BACKUP_TOKEN }}@github.com/arskawr/2d_platformer_backup.git main

  build_docker_image:
    needs: build_game
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Download WebGL Artifact
        uses: actions/download-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/arskawr/arpo1:latest
            ghcr.io/arskawr/arpo1:${{ github.sha }}

  deploy_to_pages:
    needs: build_game
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download WebGL Artifact
        uses: actions/download-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: Builds/WebGL
          branch: gh-pages

  # Telegram-оповещения
  notify:
    needs: [ sanity_check, run_tests, build_game, mirror_repo, build_docker_image, deploy_to_pages ]
    if: always() # Запускается в любом случае, даже если предыдущие задачи упали
    runs-on: ubuntu-latest
    steps:
      - name: Determine pipeline status
        id: status
        run: |
          if [ "${{ needs.sanity_check.result }}" != "success" ]; then echo "stage=sanity_check" >> $GITHUB_OUTPUT
          elif [ "${{ needs.run_tests.result }}" != "success" ]; then echo "stage=run_tests" >> $GITHUB_OUTPUT
          elif [ "${{ needs.build_game.result }}" != "success" ]; then echo "stage=build_game" >> $GITHUB_OUTPUT
          elif [ "${{ needs.mirror_repo.result }}" != "success" ]; then echo "stage=mirror_repo" >> $GITHUB_OUTPUT
          elif [ "${{ needs.build_docker_image.result }}" != "success" ]; then echo "stage=build_docker_image" >> $GITHUB_OUTPUT
          elif [ "${{ needs.deploy_to_pages.result }}" != "success" ]; then echo "stage=deploy_to_pages" >> $GITHUB_OUTPUT
          else echo "stage=none" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STAGE: ${{ steps.status.outputs.stage }}
          SITE_URL: "https://arskawr.github.io/ARPO1/"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          if [ "$STAGE" = "none" ]; then
            TEXT="Сборка ARPO1 завершена успешно.\nАвтор коммита: $AUTHOR\nИгра доступна: $SITE_URL\nПрогон: $RUN_URL"
          else
            TEXT="Сборка ARPO1 упала на задаче $STAGE.\nАвтор коммита: $AUTHOR\nЛог прогона: $RUN_URL"
          fi
          
          # Отправляем JSON через curl
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
          -H "Content-Type: application/json" \
          -d "{\"chat_id\":\"$CHAT_ID\",\"text\":\"$TEXT\"}"