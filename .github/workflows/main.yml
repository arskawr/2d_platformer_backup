name: Unity 2D Platformer CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  sanity_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Unity Directories
        run: |
          if [ -d "ProjectSettings" ]; then echo "OK"; else exit 1; fi
          if [ -d "Packages" ]; then echo "OK"; else exit 1; fi

  # ЭТАП 2 (ЛР №4): Автоматический запуск тестов Unity
  run_tests:
    needs: sanity_check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/packages-lock.json', 'Assets/**/*.asmdef') }}

      - name: Install GameCI CLI
        run: |
          curl -sL -o game-ci.tar.gz https://github.com/game-ci/cli/releases/download/v0.1.72/game-ci-linux-x64.tar.gz
          tar xzf game-ci.tar.gz ./game-ci
          echo "$PWD" >> $GITHUB_PATH

      - name: Run Unity Tests
        run: |
          game-ci test --docker --dockerShmSize=1025m \
          --engine=unity \
          --testPlatforms='playmode;editmode;COMBINE_RESULTS' \
          --engineVersion=6000.2.12f1 --coverageEnabled=false \
          --artifactsPath=artifacts \
          --dockerIsolationMode=default \
          --containerRegistryRepository=unityci/editor \
          --containerRegistryImageVersion=3
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/

  # Зеркалирование теперь ждет тесты!
  mirror_repo:
    needs: run_tests
    if: github.repository == 'arskawr/ARPO1' 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Push to Backup
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          git push --force https://x-access-token:${{ secrets.BACKUP_TOKEN }}@github.com/arskawr/2d_platformer_backup.git main

  # Docker теперь тоже ждет тесты!
  docker_publish:
    needs: run_tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Создание временных файлов-заглушек .gz
        run: |
          mkdir -p Builds/WebGL/Build Builds/WebGL/TemplateData
          touch Builds/WebGL/index.html
          touch Builds/WebGL/Build/WebGL.loader.js
          touch Builds/WebGL/Build/WebGL.framework.js.gz
          touch Builds/WebGL/Build/WebGL.wasm.gz
          touch Builds/WebGL/Build/WebGL.data.gz
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/arskawr/arpo1:${{ github.sha }}