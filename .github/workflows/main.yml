name: Unity 2D Platformer CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  sanity_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Unity Directories
        run: |
          echo "=== Проверка наличия метаданных Unity ==="
          if [ -d "ProjectSettings" ]; then echo "ProjectSettings найден."; else echo "Ошибка!" && exit 1; fi
          if [ -d "Packages" ]; then echo "Packages найден."; else echo "Ошибка!" && exit 1; fi

      - name: Locate 2D Platformer Scripts
        run: |
          echo "=== Поиск C# скриптов в папке Assets ==="
          find Assets/ -name "*Controller.cs" -print
          find Assets/ -name "BuildManager.cs" -print

  mirror_repo:
    needs: sanity_check
    if: github.repository == 'arskawr/ARPO1' 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to Backup Repository
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          echo "=== Начало процесса зеркалирования ==="
          git push --force https://x-access-token:${{ secrets.BACKUP_TOKEN }}@github.com/arskawr/2d_platformer_backup.git main

  # НОВАЯ ЗАДАЧА 3: Сборка Docker-образа и публикация в GHCR
  docker_publish:
    needs: sanity_check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Создание временных файлов-заглушек .gz для сборки образа
        run: |
          mkdir -p Builds/WebGL/Build Builds/WebGL/TemplateData
          touch Builds/WebGL/index.html
          touch Builds/WebGL/Build/WebGL.loader.js
          touch Builds/WebGL/Build/WebGL.framework.js.gz
          touch Builds/WebGL/Build/WebGL.wasm.gz
          touch Builds/WebGL/Build/WebGL.data.gz

      - name: Вход в GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация образа в GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/arskawr/arpo1:${{ github.sha }}